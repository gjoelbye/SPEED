  init_args:
    do_ica: False
    line_freqs: [60]
    sfreq: 200
    hp_freq: 0.5
    lp_freq: 50
    window_length: 60
    shift_seconds: 30
    metrics_path: "/scratch/agjma/TUH_SPEED/logs/"
