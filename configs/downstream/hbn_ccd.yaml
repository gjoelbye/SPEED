# =============================================================================
# Downstream Preprocessing Configuration — HBN Contrast Change Detection
# (unified multi-target — replaces hbn_ccd_rt.yaml + hbn_ccd_rt_4s.yaml + hbn_ccd_correct.yaml)
# =============================================================================
# One window per CCD trial (stim_onset-locked), 3 s wide so the window covers
# both the target-onset ERPs (ERN / Pe, relevant for correctness) and the
# decision / response period (relevant for RT regression). The primary
# `labels` is 3-class: `correct` / `incorrect` / `non_target` (false alarm
# trials are kept so the `ccd_non_target` secondary target works — dropping
# them would eliminate the FA signal).
#
# Every window additionally carries, under the HDF5 `targets/` group
# (populated by speed/downstream_targets.py::hbn_ccd_targets):
#
#   ccd_feedback_3class    (int8; same as `labels`, for uniform access)
#   ccd_correct            (int8; 1 smiley / 0 sad / −1 non_target)
#   ccd_rt                 (float32; response_onset − stim_onset; NaN if no response)
#   ccd_target_side        (int8; 0 left / 1 right)
#   ccd_button_side        (int8; 0 left / 1 right; −1 if no press)
#   ccd_non_target         (int8; 1 false-alarm / 0 real target)
#
# Plus subject-level identity + biometrics (sex, age, ehq_total, p_factor,
# attention, internalizing, externalizing) broadcast to every window.
#
# Usage:
#   python scripts/build_hbn_file_lists.py <out_dir>       # produces ccd.txt
#   python scripts/preprocess_downstream.py \
#     --config configs/downstream/hbn_ccd.yaml
# =============================================================================

pipeline:
  class_path: speed.pipeline.PretrainPipeline
  init_args:
    preserve_metadata: true

    # --- Event-Based Windowing ---
    event_windowing: true
    event_labels: ['correct', 'incorrect', 'non_target']
    event_tmin: -0.5                       # −0.5 s pre-stim baseline
    # 3.0 s covers stim−0.5 s … stim+2.5 s. Captures the stimulus-evoked
    # response, the median decision window (RT median 1.6 s, p95 2.17 s),
    # and the feedback-related ERN for response-locked analyses after shifting.
    event_tlen: 3.0                        # → 600 samples @ 200 Hz
    label_mapping:
      incorrect: 0
      correct: 1
      non_target: 2
    annotation_format: "hbn_ccd"
    task_type: "classification"

    # --- Processing Settings (match pretrain hbn.yaml) ---
    window_length: null
    shift_seconds: null
    sfreq: 200.0

    # --- Filter Settings ---
    hp_freq: 0.5
    lp_freq: 50.0
    line_freqs: [60.0]

    # --- ICA Settings ---
    do_ica: false
    iclabel_threshold: 0.7
    included_components:
      - brain
      - other

    # --- Channel Configuration (129 → 105 after drop-24) ---
    min_nchans: 10
    montage: null
    channels: ['E1', 'E2', 'E3', 'E4', 'E5', 'E6', 'E7', 'E8', 'E9', 'E10', 'E11', 'E12', 'E13', 'E14', 'E15', 'E16', 'E17', 'E18', 'E19', 'E20', 'E21', 'E22', 'E23', 'E24', 'E25', 'E26', 'E27', 'E28', 'E29', 'E30', 'E31', 'E32', 'E33', 'E34', 'E35', 'E36', 'E37', 'E38', 'E39', 'E40', 'E41', 'E42', 'E43', 'E44', 'E45', 'E46', 'E47', 'E48', 'E49', 'E50', 'E51', 'E52', 'E53', 'E54', 'E55', 'E56', 'E57', 'E58', 'E59', 'E60', 'E61', 'E62', 'E63', 'E64', 'E65', 'E66', 'E67', 'E68', 'E69', 'E70', 'E71', 'E72', 'E73', 'E74', 'E75', 'E76', 'E77', 'E78', 'E79', 'E80', 'E81', 'E82', 'E83', 'E84', 'E85', 'E86', 'E87', 'E88', 'E89', 'E90', 'E91', 'E92', 'E93', 'E94', 'E95', 'E96', 'E97', 'E98', 'E99', 'E100', 'E101', 'E102', 'E103', 'E104', 'E105', 'E106', 'E107', 'E108', 'E109', 'E110', 'E111', 'E112', 'E113', 'E114', 'E115', 'E116', 'E117', 'E118', 'E119', 'E120', 'E121', 'E122', 'E123', 'E124', 'E125', 'E126', 'E127', 'E128', 'Cz']
    channels_to_remove: ['E48', 'E49', 'E56', 'E63', 'E68', 'E73', 'E81', 'E88', 'E94', 'E99', 'E107', 'E113', 'E119', 'E1', 'E8', 'E14', 'E17', 'E21', 'E25', 'E32', 'E125', 'E126', 'E127', 'E128']
    channels_rename: null
    standardize_channel_names: false

    # --- Quality Check Thresholds ---
    oha_threshold: 0.00004
    thv_threshold: 0.00004
    chv_threshold: 0.00008
    min_unique_ratio: 0.001
    oha_limit: 0.8
    thv_limit: 0.5
    chv_limit: 0.5
    bcr_limit: 0.8
    drop_bad_quality: true
    return_quality_metrics: true

    # --- Interpolation Settings ---
    target_montage: null
    interpolation_mode: accurate
    use_ransac: true
    normalize: null


# =============================================================================
# Dataset Configuration
# =============================================================================
dataset_path: "/scratch/agjma/HBN_SPEED/lists/ccd.txt"
out_path: "/scratch/agjma/HBN_SPEED_downstream/ccd"
log_path: "/scratch/agjma/HBN_SPEED_downstream/ccd/logs/ccd.log"


# =============================================================================
# Processing Options
# =============================================================================
overwrite: false
shuffle_files: false
batch_size: 100
n_jobs: 1
file_extension: ".set"
log_level: INFO
