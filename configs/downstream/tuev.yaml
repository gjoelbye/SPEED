# =============================================================================
# Downstream Preprocessing Configuration - TUEV Event Detection
# =============================================================================
# 6-class event detection from TUH EEG Events Corpus
# Annotations from .tse (time-synchronized event) files
# Source: NEDC (isip.piconepress.com/projects/tuh_eeg/) — requires credentials
#
# Usage:
#   python scripts/preprocess_downstream.py --config configs/downstream/tuev.yaml
# =============================================================================

pipeline:
  class_path: speed.pipeline.PretrainPipeline
  init_args:
    preserve_metadata: true

    # --- Event-Based Windowing ---
    event_windowing: true
    event_labels: ['spsw', 'gped', 'pled', 'eyem', 'artf', 'bckg']
    event_tmin: 0.0
    event_tlen: 5.0
    label_mapping:
      spsw: 0   # spike and sharp wave
      gped: 1   # generalized periodic epileptiform discharges
      pled: 2   # periodic lateralized epileptiform discharges
      eyem: 3   # eye movement
      artf: 4   # artifact
      bckg: 5   # background
    annotation_format: "tuev"

    # --- Processing Settings ---
    window_length: null
    shift_seconds: null
    sfreq: 200.0

    # --- Filter Settings ---
    hp_freq: 0.5
    lp_freq: 100.0
    line_freqs: [60.0]              # US dataset — 60 Hz power line

    # --- ICA Settings ---
    do_ica: false
    iclabel_threshold: 0.7
    included_components:
      - brain
      - other

    # --- Channel Configuration ---
    min_nchans: 10
    bipolar_to_monopolar: true       # Convert TCP bipolar → standard monopolar
    montage: tuh
    # 19 standard channels after bipolar-to-monopolar conversion
    channels: [Fp1, Fp2, F7, F3, Fz, F4, F8, T7, C3, Cz, C4, T8, T5, P3, Pz, P4, T6, O1, O2]
    channels_to_remove: null
    channels_rename: null
    standardize_channel_names: true

    # --- Quality Check Settings ---
    oha_threshold: 0.00004
    thv_threshold: 0.00004
    chv_threshold: 0.00008
    min_unique_ratio: 0.001
    oha_limit: 0.8
    thv_limit: 0.5
    chv_limit: 0.5
    bcr_limit: 0.8
    drop_bad_quality: false
    return_quality_metrics: true

    # --- Interpolation Settings ---
    target_montage: null
    interpolation_mode: accurate
    use_ransac: true
    normalize: null


# =============================================================================
# Dataset Configuration
# =============================================================================
dataset_path: /scratch/agjma/SPEED/Original/tuev
out_path: /scratch/agjma/SPEED/Processed/tuev
log_path: /scratch/agjma/SPEED/Processed/tuev/logs/tuev_log.txt


# =============================================================================
# Processing Options
# =============================================================================
overwrite: false
shuffle_files: false
n_jobs: 16
file_extension: ".edf"
log_level: INFO
batch_size: 100


# =============================================================================
# Notes
# =============================================================================
# - 6 event types: spsw, gped, pled, eyem, artf, bckg
# - 112,491 total 5-second events
# - Original: 23 raw channels → 16 TCP bipolar → 19 monopolar after conversion
# - Original sfreq: 256 Hz → resampled to 200 Hz
# - Train: original train split 80% | Val: original train split 20% | Test: original test
# - Requires NEDC credentials for download
