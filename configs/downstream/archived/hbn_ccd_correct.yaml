# =============================================================================
# Downstream Preprocessing Configuration - HBN CCD trial correctness
# =============================================================================
# Binary classification of CCD trial outcome derived from the events.tsv
# `feedback` column: smiley_face → correct (1), sad_face → incorrect (0).
# `non_target` (false-alarm) rows and trials without a response are skipped.
# The 2 s window starts 0.5 s before the target onset (tmin=-0.5).
#
# Usage:
#   python scripts/preprocess_downstream.py --config configs/downstream/hbn_ccd_correct.yaml
# =============================================================================

pipeline:
  class_path: speed.pipeline.PretrainPipeline
  init_args:
    preserve_metadata: true

    event_windowing: true
    event_labels: ['correct', 'incorrect']
    event_tmin: -0.5
    # 2.0 s centred on the target onset (stim−0.5 … stim+1.5) covers both the
    # stimulus and the median response (RT median 1.6 s). Matches the 2 s
    # convention used by Challenge-1 (CCD RT regression) for consistency.
    event_tlen: 2.0
    label_mapping:
      incorrect: 0
      correct: 1
    annotation_format: "hbn_ccd_correct"
    task_type: "classification"

    window_length: null
    shift_seconds: null
    sfreq: 200.0

    hp_freq: 0.5
    lp_freq: 50.0
    line_freqs: [60.0]

    do_ica: false
    iclabel_threshold: 0.7
    included_components:
      - brain
      - other

    min_nchans: 10
    montage: null
    channels: ['E1', 'E2', 'E3', 'E4', 'E5', 'E6', 'E7', 'E8', 'E9', 'E10', 'E11', 'E12', 'E13', 'E14', 'E15', 'E16', 'E17', 'E18', 'E19', 'E20', 'E21', 'E22', 'E23', 'E24', 'E25', 'E26', 'E27', 'E28', 'E29', 'E30', 'E31', 'E32', 'E33', 'E34', 'E35', 'E36', 'E37', 'E38', 'E39', 'E40', 'E41', 'E42', 'E43', 'E44', 'E45', 'E46', 'E47', 'E48', 'E49', 'E50', 'E51', 'E52', 'E53', 'E54', 'E55', 'E56', 'E57', 'E58', 'E59', 'E60', 'E61', 'E62', 'E63', 'E64', 'E65', 'E66', 'E67', 'E68', 'E69', 'E70', 'E71', 'E72', 'E73', 'E74', 'E75', 'E76', 'E77', 'E78', 'E79', 'E80', 'E81', 'E82', 'E83', 'E84', 'E85', 'E86', 'E87', 'E88', 'E89', 'E90', 'E91', 'E92', 'E93', 'E94', 'E95', 'E96', 'E97', 'E98', 'E99', 'E100', 'E101', 'E102', 'E103', 'E104', 'E105', 'E106', 'E107', 'E108', 'E109', 'E110', 'E111', 'E112', 'E113', 'E114', 'E115', 'E116', 'E117', 'E118', 'E119', 'E120', 'E121', 'E122', 'E123', 'E124', 'E125', 'E126', 'E127', 'E128', 'Cz']
    channels_to_remove: ['E48', 'E49', 'E56', 'E63', 'E68', 'E73', 'E81', 'E88', 'E94', 'E99', 'E107', 'E113', 'E119', 'E1', 'E8', 'E14', 'E17', 'E21', 'E25', 'E32', 'E125', 'E126', 'E127', 'E128']
    channels_rename: null
    standardize_channel_names: false

    oha_threshold: 0.00004
    thv_threshold: 0.00004
    chv_threshold: 0.00008
    min_unique_ratio: 0.001
    oha_limit: 0.8
    thv_limit: 0.5
    chv_limit: 0.5
    bcr_limit: 0.8
    drop_bad_quality: true
    return_quality_metrics: true

    target_montage: null
    interpolation_mode: accurate
    use_ransac: true
    normalize: null


dataset_path: "/scratch/agjma/HBN_SPEED/lists/ccd.txt"
out_path: "/scratch/agjma/HBN_SPEED_downstream/ccd_correct"
log_path: "/scratch/agjma/HBN_SPEED_downstream/ccd_correct/logs/ccd_correct.log"

overwrite: false
shuffle_files: false
batch_size: 100
n_jobs: 1
file_extension: ".set"
log_level: INFO
