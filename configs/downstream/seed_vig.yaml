# =============================================================================
# Downstream Preprocessing Configuration - SEED-VIG Vigilance Estimation
# =============================================================================
# Regression task: predict vigilance level (PERCLOS-derived target)
# Requires conversion from .mat to EDF first: python scripts/converters/convert_seed_vig.py
# Source: BCMI lab, Shanghai Jiao Tong University
#
# Usage:
#   python scripts/preprocess_downstream.py --config configs/downstream/seed_vig.yaml
# =============================================================================

pipeline:
  class_path: speed.pipeline.PretrainPipeline
  init_args:
    preserve_metadata: true
    task_type: regression

    # --- Event-Based Windowing ---
    # After conversion, annotations are embedded as 'perclos_<value>'
    # The label_mapping is not used for regression — labels are parsed
    # from annotation descriptions by the conversion script.
    event_windowing: true
    event_labels: []                         # Match all annotations (filtered in post)
    event_tmin: 0.0
    event_tlen: 8.0
    label_mapping: {}
    annotation_format: "eegmmidb"    # Annotations embedded in EDF by conversion script

    # --- Processing Settings ---
    window_length: null
    shift_seconds: null
    sfreq: 200.0

    # --- Filter Settings ---
    hp_freq: 0.5
    lp_freq: 100.0
    line_freqs: [50.0]              # China — 50 Hz power line

    # --- ICA Settings ---
    do_ica: false
    iclabel_threshold: 0.7
    included_components:
      - brain
      - other

    # --- Channel Configuration ---
    min_nchans: 10
    montage: tuh
    # 17 channels
    channels: [Fp1, Fpz, Fp2, F7, F3, Fz, F4, F8, T7, C3, Cz, C4, T8, P3, Pz, P4, O1]
    channels_to_remove: null
    channels_rename: null
    standardize_channel_names: true

    # --- Quality Check Settings ---
    oha_threshold: 0.00004
    thv_threshold: 0.00004
    chv_threshold: 0.00008
    min_unique_ratio: 0.001
    oha_limit: 0.8
    thv_limit: 0.5
    chv_limit: 0.5
    bcr_limit: 0.8
    drop_bad_quality: false
    return_quality_metrics: true

    # --- Interpolation Settings ---
    target_montage: null
    interpolation_mode: accurate
    use_ransac: true
    normalize: null


# =============================================================================
# Dataset Configuration
# =============================================================================
dataset_path: /scratch/agjma/SPEED/Original/seed_vig/edf
out_path: /scratch/agjma/SPEED/Processed/seed_vig
log_path: /scratch/agjma/SPEED/Processed/seed_vig/logs/seed_vig_log.txt


# =============================================================================
# Processing Options
# =============================================================================
overwrite: false
shuffle_files: false
n_jobs: 16
file_extension: ".edf"
log_level: INFO
batch_size: 100


# =============================================================================
# Notes
# =============================================================================
# - 23 subjects, 20,355 total 8-second samples
# - Regression: predict PERCLOS-derived vigilance score (continuous float)
# - Original: .mat at 200 Hz → converted to EDF (already at target sfreq)
# - 17 EEG channels
# - Train: subjects 1-15 | Val: subjects 16-19 | Test: subjects 20-23
# - Regression labels embedded as 'perclos_<value>' annotations
