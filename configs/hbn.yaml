pipeline:
  class_path: speed.pipeline_challenge.PretrainPipeline
  init_args:
    do_ica: False
    line_freqs: [60]
    sfreq: 100
    hp_freq: 0.5
    lp_freq: 50
    window_length: None
    metrics_path: "/scratch/linsk/"
    return_quality_metrics: True
    drop_bad_quality: False
    channnels_to_remove: [] # fill
    channels: #? needed else reorder wont work
    montage: None # and all other stuff like tin notebook 
dataset_path: "/scratch/linsk/hbn_test"
out_path: "/scratch/linsk/hbn_test_preprocessed"
log_path: "/scratch/linsk/hbn_test_log.txt"
file_extension: "RestingState_eeg.set"
overwrite: False
shuffle_files: True
batch_size: 2
n_jobs: 1