pipeline:
  class_path: speed.pipeline.PretrainPipeline
  init_args:
    # --- Window Settings ---
    window_length: 60              # Window length in seconds. null = full file.
    shift_seconds: 30              # Window shift for overlap. null = no overlap.
    sfreq: 200.0                     # Target sampling frequency (Hz).
    
    # --- Filter Settings ---
    hp_freq: 0.5                     # High-pass filter cutoff (Hz). null = skip.
    lp_freq: 50.0                    # Low-pass filter cutoff (Hz). null = skip.
    line_freqs: [60.0]               # Power line frequencies to notch filter.
    
    # --- ICA Settings ---
    do_ica: false                    # Whether to run ICA artifact rejection.
    iclabel_threshold: 0.7           # Probability threshold for component rejection.
    included_components:             # Component types to keep.
      - brain
      - other
    
    # --- Channel Configuration ---
    min_nchans: 10                   # Minimum channels required to process file.
    
    # Montage: "tuh", standard MNE name (e.g., "standard_1005"), 
    # path to .fif file, or null for no montage.
    montage: null                    # HBN uses embedded channel locations
    
    # Required output channels in order (REQUIRED - no default)
    channels: ['Fp1', 'Fp2', 'F7', 'F3', 'Fz', 'F4', 'F8', 'T7', 'C3', 'Cz', 'C4', 'T8', 'T5', 'P3', 'Pz', 'P4', 'T6', 'O1', 'O2']
    
    channels_to_remove: null
    channels_rename: null            # Channel rename mapping {old: new}.
    standardize_channel_names: true # Apply TUH-style channel name standardization.
    
    # --- Quality Check Thresholds ---
    oha_threshold: 0.00004           # 40e-6 V - Overall High Amplitude threshold.
    thv_threshold: 0.00004           # 40e-6 V - Temporal High Variance threshold.
    chv_threshold: 0.00008           # 80e-6 V - Channel High Variance threshold.
    min_unique_ratio: 0.001          # Min ratio of unique samples per channel.
    
    # --- Quality Decision Limits ---
    oha_limit: 0.8                   # Max fraction of high-amplitude samples.
    thv_limit: 0.5                   # Max fraction of high-variance time points.
    chv_limit: 0.5                   # Max fraction of high-variance channels.
    bcr_limit: 0.8                   # Max bad channel ratio.
    
    drop_bad_quality: true          # Drop windows failing quality checks.
    return_quality_metrics: true     # Collect quality metrics for export.
    
    # --- Interpolation Settings ---
    # Path to target montage .fif file for spatial interpolation.
    # If set, channels will be interpolated to this montage instead of
    # using the standard interpolate_missing + drop_extra approach.
    target_montage: null
    
    interpolation_mode: accurate     # MNE interpolation: "accurate" or "fast".
    use_ransac: true                 # Use RANSAC for bad channel detection.


# =============================================================================
# Dataset Configuration
# =============================================================================
dataset_path: "/dtu-compute/EEG_at_scale/TUH_EEG/tuh_eeg/data/tuh_eeg/v2.0.0/edf"
out_path: "/scratch/agjma/TUH_SPEED"  # Output directory.
log_path: "/scratch/agjma/TUH_SPEED/logs/tuh_log.txt"  # Log file path.


# =============================================================================
# Processing Options
# =============================================================================
overwrite: false              # If false, skip already processed files.
shuffle_files: True          # Randomly shuffle file order.
batch_size: 4                 # Files per HDF5 batch (ignored if save_as_hdf5=false).
n_jobs: 48                    # Number of parallel workers.
file_extension: ".edf"        # Extension(s): ".edf", ".set", or [".edf", ".set"].
list_file: null               # Text file with explicit file paths.
save_as_hdf5: true           # true = batch HDF5, false = individual BDF files.
log_level: INFO               # DEBUG, INFO, WARNING, ERROR.
sleep_after_batch: 5.0        # Seconds to sleep after each batch.
metrics_path: "/scratch/agjma/TUH_SPEED/logs/quality_metrics.csv"  # Directory to save quality_metrics.csv.


