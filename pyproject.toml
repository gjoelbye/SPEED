[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speed-eeg"
version = "2.0.0"
description = "SPEED: Scalable Preprocessing of EEG Data for Self-Supervised Learning"
readme = "README.md"
authors = [{ name = "SPEED Authors" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "torch>=2.1.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "mne>=1.5",
  "mne-icalabel>=0.4",
  "pyprep>=0.4",
  "meegkit>=0.1.7",
  "moabb>=0.5.0",
  "braindecode>=0.7",
  "h5py>=3.9",
  "tqdm>=4.66",
  "joblib>=1.3",
  "jsonargparse>=4.24.0",
  "pytorch-lightning>=2.1.0",
  "wandb>=0.15.12",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
io = [
  "pyedflib>=0.1.30",
  "eeglabio>=0.0.2",
]
dev = [
  "ruff>=0.1.1",
  "pytest>=7.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["speed*"]
